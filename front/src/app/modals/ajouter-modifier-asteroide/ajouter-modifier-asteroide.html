<h2 mat-dialog-title>{{ labelBtn() }} une planète</h2>
<mat-dialog-content>
    <form [formGroup]="form">
        <jp-grid-container [gap]="15">
            <jp-grid-element [colDefault]="12">
                <jp-input-text label="Nom" formControlName="nom" />
            </jp-grid-element>

            <jp-grid-element [colDefault]="12">
                <mat-form-field>
                    <mat-label>Statut Géopolitique</mat-label>
                    <mat-select formControlName="statut">
                        @for (statut of listeStatuts; track statut.valeur) 
                        {
                            <mat-option [value]="statut.valeur">{{ statut.nom }}</mat-option>
                        }
                    </mat-select>
                </mat-form-field>
            </jp-grid-element>

            <jp-grid-element [colDefault]="12">
                <jp-textarea label="Description" formControlName="description" [rows]="5" showMaxLength />
            </jp-grid-element>
        </jp-grid-container>
    </form>
</mat-dialog-content>
<mat-dialog-actions>
    <jp-button-loader matButton="text" matDialogClose label="Fermer" />&nbsp;
    <jp-button-loader [loading]="btnClick()" (clicked)="ValiderForm()" [label]="labelBtn()" />
</mat-dialog-actions>
