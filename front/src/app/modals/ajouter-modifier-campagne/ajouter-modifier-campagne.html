<h2 mat-dialog-title>{{ labelBtn() }} une campagne</h2>
<mat-dialog-content>
    <form [formGroup]="form">
        
        <jp-input-text label="Nom" formControlName="nom" showMaxLength />

        <div style="margin-bottom: 16px;">
            <jp-input-text label="Date interval" formControlName="intervalDate" />
        </div>

        <jp-textarea label="Resumé" formControlName="resumer" [rows]="7" showMaxLength />
    </form>
</mat-dialog-content>
<mat-dialog-actions>
    <button matButton="filled" mat-dialog-close>Fermer</button>&nbsp;
    <jp-button-loader [label]="labelBtn()" [loading]="btnClick()" (clicked)="Valider()" />
</mat-dialog-actions>
